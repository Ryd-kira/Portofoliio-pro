<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Administration</title>
<style>
:root{--bg:#090c11;--panel:#10151c;--line:#232b36;--text:#ebe8e1;--mut:#9ca6b3;--acc:#4f8cff;--cy:#35c6d4;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:28px;margin:0 0 16px}
h2{font-size:20px;margin:0 0 12px}
h3{font-size:16px;margin:0}
a{color:var(--acc)}
input,select,textarea,button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:9px 12px}
input:not([type=checkbox]),select,textarea{width:100%}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--cy);outline:0}
button{cursor:pointer;margin:0 8px 8px 0}
button:hover{border-color:var(--acc)}
button[aria-pressed=true]{border-color:var(--cy)}
label{display:grid;gap:6px;color:var(--mut);margin-bottom:14px}
label:has(input[type=checkbox]){display:flex;align-items:center;gap:10px}
article,section,form{border-top:1px solid var(--line);padding:18px 0}
#tabs{display:flex;flex-wrap:wrap;margin-bottom:12px}
p{margin:0 0 10px}
.mut,small{color:var(--mut)}
article p{white-space:pre-wrap}
img{display:block;margin:0 0 12px;border:1px solid var(--line);border-radius:4px}
[hidden]{display:none!important}
#msg:empty{display:none}
#msg,#msg.mut{position:fixed;left:12px;right:12px;bottom:12px;max-width:720px;margin:0 auto;background:var(--panel);border:1px solid var(--acc);border-radius:6px;padding:10px 14px;z-index:5;color:var(--text)}
</style>
</head>
<body>
<main>
<h1>Administration</h1>

<form id="lf" hidden>
<label>Mot de passe<input type="password" id="pw" autocomplete="current-password" required></label>
<button type="submit">Se connecter</button>
<p id="le" role="status"></p>
</form>

<div id="app" hidden>
<div id="tabs"></div>
<p id="seed" hidden>Le contenu du site n’a pas encore été importé dans la base. <button type="button" id="seedb">Importer le contenu actuel</button></p>
<p id="msg" class="mut" role="status"></p>
<div id="panel"></div>
<button type="button" id="out">Se déconnecter</button>
</div>
</main>
<script src="/admin.js" defer></script>
</body>
</html>
