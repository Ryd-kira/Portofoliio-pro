<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Administration</title>
<style>
:root{--bg:#090c11;--side:#0c1118;--panel:#10151c;--line:#232b36;--text:#ebe8e1;--mut:#9ca6b3;--acc:#4f8cff;--cy:#35c6d4;--am:#e0b04a;--red:#e5736b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;overflow-wrap:break-word}
a{color:var(--acc)}
h1{font-size:22px;margin:0}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:15px;margin:0}
p{margin:0 0 10px}
.mut,small{color:var(--mut)}
input,select,textarea,button,.btn{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;text-decoration:none;display:inline-block;cursor:pointer}
input:not([type=checkbox]),select,textarea{width:100%;cursor:text}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
button:hover,.btn:hover{border-color:var(--acc)}
.pri{background:var(--acc);border-color:var(--acc);color:#07101f;font-weight:600}
.dng{border-color:#5a2f2b;color:var(--red)}
.ghost{background:none}
label{display:grid;gap:6px;color:var(--mut);margin-bottom:14px}
label:has(input[type=checkbox]){display:flex;align-items:center;gap:10px}
[hidden]{display:none!important}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:2px}
.brand{font-weight:700;font-size:16px;padding:4px 12px 12px}
.grp{color:var(--mut);font-size:12px;padding:14px 12px 4px}
.nv{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:none;border-radius:6px;padding:9px 12px;color:var(--mut)}
.nv:hover{background:var(--panel);color:var(--text)}
.nv[aria-current=page]{background:var(--panel);color:var(--text);box-shadow:inset 3px 0 var(--cy)}
.foot{margin-top:auto;display:grid;gap:8px;padding-top:16px}
.main{padding:24px 28px 90px;min-width:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.top h1{flex:1}
#burger{display:none}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{text-align:left;padding:14px;border-radius:8px}
.stat b{display:block;font-size:28px;line-height:1.1}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:16px}
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.item:first-child{border-top:0}
.item .t{flex:1 1 220px;min-width:0}
.tag{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:1px 7px;color:var(--mut);white-space:nowrap}
.tag.ok{color:var(--cy);border-color:#1f4a50}
.tag.warn{color:var(--am);border-color:#5a4a22}
.tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.tools input{flex:1 1 200px}
.bar{position:sticky;bottom:0;background:var(--bg);padding:12px 0;border-top:1px solid var(--line);display:flex;gap:8px;margin-top:8px}
.pv{display:block;margin:0 0 12px;border:1px solid var(--line);border-radius:6px;max-width:100%}
.login{max-width:380px;margin:12vh auto;padding:20px}
.login h1{margin-bottom:16px}
article.box p{white-space:pre-wrap}
#msg:empty{display:none}
#msg{position:fixed;left:12px;right:12px;bottom:12px;max-width:560px;margin:0 auto;background:var(--panel);border:1px solid var(--acc);border-radius:8px;padding:10px 14px;z-index:30}
@media(max-width:860px){
.shell{grid-template-columns:minmax(0,1fr)}
.side{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:20;transform:translateX(-100%);transition:transform .2s}
.side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
#burger{display:inline-block}
.main{padding:16px 16px 90px}
}
</style>
</head>
<body>
<form id="lf" class="login box" hidden>
<h1>Administration</h1>
<label>Mot de passe<input type="password" id="pw" autocomplete="current-password" required></label>
<button type="submit" class="pri">Se connecter</button>
<p id="le" role="status"></p>
</form>

<div id="app" class="shell" hidden>
<aside id="side" class="side" aria-label="Menu d’administration">
<div class="brand">Administration</div>
<nav id="nav"></nav>
<div class="foot">
<a class="btn ghost" href="/" target="_blank" rel="noopener">Voir le site</a>
<button type="button" id="out" class="ghost">Se déconnecter</button>
</div>
</aside>
<div class="main">
<div class="top">
<button type="button" id="burger" class="ghost" aria-controls="side">Menu</button>
<h1 id="ptitle"></h1>
</div>
<p id="seed" class="box" hidden>Le contenu du site n’a pas encore été importé dans la base. <button type="button" id="seedb" class="pri">Importer le contenu actuel</button></p>
<div id="panel"></div>
</div>
</div>
<p id="msg" role="status"></p>
<script src="/admin.js" defer></script>
</body>
</html>
